{% set name = "latex-rubber" %}
{% set version = "1.6.7" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 23bbebf05ea0c7d93efc8bf3966fef0dcef9d350c10a7137936535084fa1c565

build:
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  noarch: python
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling
  run:
    - python >={{ python_min }}

test:
  imports:
    - rubber
  commands:
    - pip check
    - rubber --version
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://gitlab.com/latex-rubber/rubber
  summary: an automated system for building LaTeX documents
  license: GPL-3.0-or-later
  license_file: COPYING

extra:
  recipe-maintainers:
    - HaoZeke
